baseURL = 'https://portfolio.carlosescorcia21.workers.dev/'
title = 'Carlos Escorcia'
defaultContentLanguage = "en"

[params]
  user = "carlos"
  hostName = "dev"
  favicon = "images/favicon.svg"
  
[languages]
  [languages.en]
    languageName = "English"
    weight = 1

  [languages.es]
    languageName = "Español"
    weight = 2
  
  [languages.en.menu]
    [[languages.en.menu.header]]
      name = "blog"
      weight = 1
      url = "posts"
    [[languages.en.menu.header]]
      name = "about"
      weight = 2
      url = "/"
    [[languages.en.menu.header]]
      name = "rss"
      weight = 3
      url = "/index.xml"

  [languages.es.menu]
    [[languages.es.menu.header]]
      name = "blog"
      weight = 1
      url = "posts"
    [[languages.es.menu.header]]
      name = "acerca_de"
      weight = 2
      url = "/"
    [[languages.es.menu.header]]
      name = "rss"
      weight = 3
      url = "/index.xml"

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 2

  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    
[outputs]
home = ['html', 'rss']
section = ['html']
taxonomy = ['html']
term = ['html']