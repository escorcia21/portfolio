<!-- Footer -->
<div class="flex flex-col items-center justify-center gap-2 py-8 font-mono">
  {{ $authorData := index site.Data .Language.Lang "author" }}
  {{ $author := cond (and $authorData $authorData.author) $authorData.author site.Params }}
  {{ with $author }}
    <p class="text-center">
      ©
      {{ now.Format "2006" }}
      {{ .name }}
    </p>
    <p class="text-center">
      {{ T "builtUsing" }}
      <a href="https://gohugo.io/" target="_blank" class="animated-link">Hugo</a
      >.
      {{ T "takeALookAtMy" }}
      <a href="{{ .github }}" target="_blank" class="animated-link">GitHub</a>
    </p>
  {{ end }}
</div>
